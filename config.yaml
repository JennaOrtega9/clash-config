mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

proxy-providers:
  SUB:
    type: http
    url: "这里替换成你的机场订阅链接"
    path: ./providers/sub.yaml
    interval: 86400
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204

proxy-groups:
  - name: 节点选择
    type: select
    use:
      - SUB

  - name: 自动选择
    type: url-test
    use:
      - SUB
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 故障转移
    type: fallback
    use:
      - SUB
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: AI
    type: select
    proxies:
      - 自动选择
      - 故障转移
      - 节点选择
      - DIRECT

  - name: OpenAi
    type: select
    proxies:
      - AI
      - 自动选择
      - 节点选择

  - name: Claude
    type: select
    proxies:
      - AI
      - 自动选择
      - 节点选择

  - name: Gemini
    type: select
    proxies:
      - AI
      - 自动选择
      - 节点选择

  - name: YouTube
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: Netflix
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: Disney
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: Spotify
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: Telegram
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: Twitter
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: Tiktok
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: GitHub
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: Google
    type: select
    proxies:
      - 自动选择
      - 节点选择
      - DIRECT

  - name: Microsoft
    type: select
    proxies:
      - 节点选择
      - DIRECT

  - name: Apple
    type: select
    proxies:
      - DIRECT
      - 节点选择

  - name: Steam
    type: select
    proxies:
      - DIRECT
      - 自动选择
      - 节点选择

  - name: Binance
    type: select
