mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

proxy-groups:
  - name: 节点选择
    type: select
    include-all: true
    filter: "^(?!.*(剩余|流量|套餐|官网|订阅|到期|过期)).*$"

  - name: 自动选择
    type: url-test
    include-all: true
    filter: "^(?!.*(剩余|流量|套餐|官网|订阅|到期|过期)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 故障转移
    type: fallback
    include-all: true
    filter: "^(?!.*(剩余|流量|套餐|官网|订阅|到期|过期)).*$"
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: AI
    type: select
    proxies:
      - 自动选择
      - 故障转移
      - 节点选择
      - DIRECT

  - name: OpenAi
    type: select
    proxies:
      - AI
      - 自动选择
      - 节点选择
      - DIRECT

