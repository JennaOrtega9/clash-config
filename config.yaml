# 由可视化配置自动生成
# 代理模式: 智能分流
# 节点策略: 自动选择
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

find-process-mode: off

sniffer:
  enable: false

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.market.xiaomi.com"
    - "time.*.com"
    - "localhost.ptlogin2.qq.com"
    - "+.localhost.sec.qq.com"
    - "+.plex.direct"
    - "+.router.asus.com"
    - "routerlogin.com"
    - "tplogin.cn"
    - "miwifi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  fallback:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4

proxies:

proxy-groups:
  - name: "$app_name"
    type: select
    proxies: []

  - name: "自动选择"
    type: url-test
    proxies: []
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "故障转移"
    type: fallback
    proxies: []
    url: "https://www.gstatic.com/generate_204"
    interval: 300

  - name: "AI"
    type: select
    proxies:
      - "$app_name"
      - "自动选择"
      - "故障转移"
      - DIRECT

  - name: "守候影院"
    type: select
    proxies:
      - "$app_name"
