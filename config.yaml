mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxy-groups:
  - name: 默认代理
    type: select
    proxies:
      - 自动选择
      - 手动切换
      - DIRECT

  - name: 手动切换
    type: select
    include-all: true
    filter: "^(?!.*(剩余|流量|套餐|官网|订阅|到期|过期|Traffic|Expire)).*$"

  - name: 自动选择
    type: url-test
    include-all: true
    filter: "^(?!.*(剩余|流量|套餐|官网|订阅|到期|过期|Traffic|Expire)).*$"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50

  - name: 守候网络服务
    type: select
    proxies:
      - 默认代理
      - 手动切换
      - DIRECT

  - name: 流媒体
    type: select
    proxies:
      - 默认代理
      - 手动切换
      - DIRECT

  - name: AI工具
    type: select
    proxies:
      - 默认代理
      - 手动切换
      - DIRECT

  - name: 社交媒体
    type: select
    proxies:
      - 默认代理
      - 手动切换
      - DIRECT

  - name: 开发者工具
    type: select
    proxies:
      - 默认代理
      - 手动切换
      - DIRECT

  - name: 网络云盘
    type: select
    proxies:
      - 默认代理
      - 手动切换
      - DIRECT

  - name: 游戏加速
    type: select
    proxies:
      - DIRECT
      - 默认代理
      - 手动切换

  - name: 国际服务
    type: select
    proxies:
      - 默认代理
      - 手动切换
      - DIRECT

  - name: PrivateTracker
    type: select
    proxies:
      - DIRECT
      - 默认代理
      - 手动切换

  - name: 国内服务
    type: select
    proxies:
      - DIRECT
      - 默认代理

  - name: 漏网之鱼
    type: select
    proxies:
      - 默认代理
      - 手动切换
      - DIRECT

