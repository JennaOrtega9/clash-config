    type: select
    proxies:
      - 自动选择
      - 故障转移
      - 节点选择
      - DIRECT

rules:
  # Emby
  - DOMAIN-SUFFIX,cn2gias.uk,Emby影院
  - DOMAIN-KEYWORD,emby,Emby影院

  # SNTP
  - DOMAIN-SUFFIX,sntp.uk,SNTP
  - DOMAIN-SUFFIX,wuyouyun.com,SNTP
  - DOMAIN-SUFFIX,qzyidc.com,SNTP

  # OpenAI
  - DOMAIN-SUFFIX,openai.com,OpenAi
  - DOMAIN-SUFFIX,chatgpt.com,OpenAi
  - DOMAIN-SUFFIX,oaistatic.com,OpenAi
  - DOMAIN-SUFFIX,oaiusercontent.com,OpenAi

  # Claude
